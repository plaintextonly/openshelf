<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>plaintextonly | Kindle Unlimited Books</title>
  <meta name="description" content="Kindle Unlimitedで読んだ本、気になる本を静かに記録する紹介サイト。">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="#" aria-label="トップへ">plaintextonly</a>
      <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="#">Home</a>
        <a href="#" aria-current="page">Books</a>
        <a href="#">About</a>
      </nav>
      <button class="icon-button" type="button" id="focusSearch" aria-label="検索欄へ移動">
        <span aria-hidden="true">⌕</span>
      </button>
    </header>

    <main>
      <section class="page-lead" aria-labelledby="pageTitle">
        <div>
          <h1 id="pageTitle">Books</h1>
          <p>KUで読んだ、または見つけた本の記録です。<br>KUから外れていることに気づいたタイミングで削除します。</p>
        </div>
        <p class="lead-note"><br></p>
      </section>

      <section class="controls" aria-label="本の絞り込み">
        <div class="category-list" id="categoryList" aria-label="カテゴリ"></div>

        <form class="search-form" id="searchForm" role="search">
          <label class="visually-hidden" for="searchInput">タイトル・著者名・キーワードで検索</label>
          <input id="searchInput" type="search" placeholder="タイトル・著者名・キーワードで検索..." autocomplete="off">
          <button type="submit" aria-label="検索する">⌕</button>
        </form>

        <div class="result-row">
          <p id="resultCount">検索結果：0件</p>
          <label>
            <span>並び替え：</span>
            <select id="sortSelect">
              <option value="read-desc">KU確認日（新しい順）</option>
              <option value="read-asc">KU確認日（古い順）</option>
              <option value="title-asc">タイトル（昇順）</option>
              <option value="author-asc">著者名（昇順）</option>
            </select>
          </label>
        </div>
      </section>

      <section class="book-list" id="bookList" aria-live="polite"></section>
      <nav class="pagination" id="pagination" aria-label="ページ送り"></nav>
      <p class="empty-state" id="emptyState" hidden>該当する本が見つかりませんでした。</p>
      <br />
      ※当サイトはAmazonアソシエイト・プログラムに参加しています。
    </main>
  </div>

  <button class="back-to-top" type="button" id="backToTop" aria-label="ページの先頭へ戻る">↑</button>

  <script src="script.js?v=8"></script>
</body>
</html>
